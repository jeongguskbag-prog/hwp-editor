name: Release build

# 서명된 출시용 AAB(Play 업로드용)와 APK 를 만든다.
# 실행: Actions 탭 → "Release build" → Run workflow, 또는 v1.0.0 같은 태그 푸시.
# Play 스토어에 자동으로 올리거나 공개 릴리스를 만들지는 않음 — 결과는 Artifacts 에서 받음.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      # HWP 엔진(@rhwp/core) 을 고정 버전·무결성 검사로 받아 앱 안에 넣음
      - name: Fetch HWP engine
        run: bash scripts/fetch-engine.sh

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.HWPEDITOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HWPEDITOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HWPEDITOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HWPEDITOR_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing HWPEDITOR_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing HWPEDITOR_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing HWPEDITOR_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing HWPEDITOR_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HWPEDITOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "HWPEDITOR_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          HWPEDITOR_KEYSTORE_PASSWORD: ${{ secrets.HWPEDITOR_KEYSTORE_PASSWORD }}
          HWPEDITOR_KEY_ALIAS: ${{ secrets.HWPEDITOR_KEY_ALIAS }}
          HWPEDITOR_KEY_PASSWORD: ${{ secrets.HWPEDITOR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verify signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: HwpEditor-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
